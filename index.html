<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="#/">My Blog</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크모드 전환">
        <span aria-hidden="true">🌓</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section id="post-list" class="post-list"></section>

    <article id="post-detail" class="post-detail" hidden>
      <a href="#/" class="back-link">← 목록으로</a>
      <h1 id="post-title"></h1>
      <p id="post-date" class="post-date"></p>
      <div id="post-body" class="post-body"></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© 2026 My Blog</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
